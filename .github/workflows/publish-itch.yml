name: Publish builds to itch.io

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  ITCH_TARGET: yphil/president-gp

jobs:
  publish:
    name: Export and publish all platforms
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export Web build
        run: |
          mkdir -p export/web
          godot --headless --verbose --export-release "Web" export/web/index.html

      - name: Export Linux build
        run: |
          mkdir -p export/linux
          godot --headless --verbose --export-release "Linux/X11" export/linux/president-gp.x86_64

      - name: Export Windows build
        run: |
          mkdir -p export/windows
          godot --headless --verbose --export-release "Windows Desktop" export/windows/president-gp.exe

      - name: Export macOS build
        run: |
          mkdir -p export/macos
          godot --headless --verbose --export-release "macOS" export/macos/president-gp.zip

      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test -n "$BUTLER_API_KEY"
          butler push export/web "$ITCH_TARGET:html5" --userversion "$RELEASE_VERSION"
          butler push export/linux "$ITCH_TARGET:linux" --userversion "$RELEASE_VERSION"
          butler push export/windows "$ITCH_TARGET:windows" --userversion "$RELEASE_VERSION"
          butler push export/macos "$ITCH_TARGET:osx" --userversion "$RELEASE_VERSION"
