app-id: io.yphil.PresidentGP
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: president-gp

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all

modules:
  - name: president-gp
    buildsystem: simple
    build-commands:
      - install -Dm755 president-gp.x86_64 /app/bin/president-gp
      - install -Dm644 president-gp.pck /app/bin/president-gp.pck
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.yphil.PresidentGP.png
      - install -Dm644 io.yphil.PresidentGP.desktop /app/share/applications/io.yphil.PresidentGP.desktop
      - install -Dm644 io.yphil.PresidentGP.metainfo.xml /app/share/metainfo/io.yphil.PresidentGP.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/yphil-dev/president_racer/releases/download/1.4.2/president-gp-linux.zip
        # Replace this with the sha256 printed by the release workflow.
        sha256: REPLACE_WITH_SHA256_OF_ZIP
      - type: file
        path: io.yphil.PresidentGP.desktop
      - type: file
        path: io.yphil.PresidentGP.metainfo.xml
